<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>21 razones — prototipo de referencia</title>
<!-- Prototipo de REFERENCIA (vanilla). Lee ../contenido/razones.es.json. Reimplementar en el stack del proyecto. -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#11151D;--card:#1A202B;--line:#262E3B;--txt:#EDEFF3;--muted:#8A93A3;--gold:#F2B544;--paper:#F6EFE1;--ink:#1B1F27}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif}
main{max-width:1120px;margin:0 auto;padding:64px 16px 80px;display:flex;flex-direction:column;gap:40px}
header{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.kicker{margin:0;font:500 15px 'Space Grotesk',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h1{margin:0;font:700 clamp(32px,5vw,56px)/1.05 'Space Grotesk',sans-serif;max-width:820px}
.bar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:14px 18px}
.track{height:6px;background:#2A3240;border-radius:3px;overflow:hidden;margin-top:8px}
.fill{height:100%;background:var(--gold);width:0;transition:width .4s}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #3A4352;background:none;color:var(--txt);font:inherit;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{perspective:1000px;background:none;border:0;padding:0;height:250px;width:100%;cursor:pointer;font:inherit;color:inherit;text-align:left}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:18px}
.inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.card[aria-pressed="true"] .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px}
.front{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.coin{width:116px;height:116px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE29A 0%,#F2B544 38%,#C98A1B 75%,#9A6510 100%);box-shadow:inset 0 0 0 6px rgba(255,255,255,.18),inset 0 -6px 12px rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#5A3A05;transition:transform .25s}
.card:hover .coin{transform:translateY(-3px) rotate(-6deg)}
.coin b{font-size:40px;line-height:1}.coin i{font-style:normal;font-size:16px}
.num{font-size:13px;color:var(--muted);letter-spacing:.08em}
.back{transform:rotateY(180deg);background:var(--paper);color:var(--ink);padding:20px 18px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.back .n{font:700 13px 'Space Grotesk',sans-serif;color:#9A6510}
.back .t{font:700 18px/1.2 'Space Grotesk',sans-serif}
.back .d{font-size:14px;line-height:1.4;color:#424957}
.done{display:none;text-align:center;background:var(--gold);color:var(--ink);border-radius:18px;padding:36px 24px;flex-direction:column;gap:16px;align-items:center}
.done.show{display:flex}
.done p{margin:0;font:700 28px 'Space Grotesk',sans-serif}
.done a{display:inline-flex;align-items:center;min-height:48px;padding:0 28px;border-radius:12px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:700}
.disc{margin:0 auto;font-size:13px;color:var(--muted);text-align:center;max-width:640px}
@media (prefers-reduced-motion:reduce){.inner,.coin{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <p class="kicker" id="kicker"></p>
    <h1 id="titulo"></h1>
    <p id="instruccion" style="margin:0;color:#AEB5C2;font-size:17px"></p>
  </header>
  <div class="bar">
    <div style="flex:1 1 240px;min-width:0">
      <span>Diste vuelta <strong id="count" style="color:var(--gold)">0</strong> de 21</span>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
    <button class="btn" id="all">Ver todas</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="done" id="done"><p id="cierre"></p><a href="/regalar" id="cta"></a></div>
  <p class="disc" id="disc"></p>
</main>
<script>
fetch('../contenido/razones.es.json').then(r => r.json()).then(data => {
  const $ = id => document.getElementById(id);
  $('kicker').textContent = data.kicker; $('titulo').textContent = data.titulo;
  $('instruccion').textContent = data.instruccion; $('disc').textContent = data.disclaimer;
  $('cierre').textContent = data.cierre.titulo; $('cta').textContent = data.cierre.cta;
  const grid = $('grid');
  data.razones.forEach(r => {
    const b = document.createElement('button');
    b.className = 'card'; b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', `Razón ${r.n} de 21: ${r.titulo} ${r.explicacion}`);
    b.innerHTML = `<div class="inner">
      <div class="face front"><div class="coin" aria-hidden="true"><b>${r.n}</b><i>₿</i></div><span class="num">${r.n} / 21</span></div>
      <div class="face back"><span class="n">${r.n} / 21</span><span class="t"></span><span class="d"></span></div></div>`;
    b.querySelector('.t').textContent = r.titulo; b.querySelector('.d').textContent = r.explicacion;
    b.addEventListener('click', () => { b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); update(); });
    grid.appendChild(b);
  });
  function update() {
    const n = grid.querySelectorAll('[aria-pressed="true"]').length;
    $('count').textContent = n; $('fill').style.width = (n / 21 * 100) + '%';
    $('done').classList.toggle('show', n === 21);
    $('all').textContent = n === 21 ? 'Darlas vuelta de nuevo' : 'Ver todas';
  }
  $('all').addEventListener('click', () => {
    const all = grid.querySelectorAll('[aria-pressed="true"]').length === 21;
    grid.querySelectorAll('.card').forEach(c => c.setAttribute('aria-pressed', all ? 'false' : 'true'));
    update();
  });
});
</script>
</body>
</html>
