<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparativa — Regalale Bitcoin (prototipo)</title>
<!-- Prototipo de referencia. Lee ../contenido/comparativa.es.json: servir docs/ con un server estático. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--tinta:#1A1530;--suave:#3D3852;--gris:#5C566E;--naranja:#FF8A1F;--amarillo:#FFD23F;--fondo:#FFFBF5;--marca-titulo:#D96400;--marca-texto:#B85300}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:'DM Sans',system-ui,sans-serif}
section{max-width:1200px;margin:0 auto;padding:88px 24px 96px;display:flex;flex-direction:column;gap:40px}
header{text-align:center;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;align-items:center}
.kicker{background:var(--tinta);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;font-weight:800;margin:0}
h2{font-size:clamp(2rem,4.5vw,3.25rem);line-height:1.05;letter-spacing:-.02em}h2 em{color:var(--marca-titulo)}
header p{margin:0;font-size:1.125rem;line-height:1.55;color:var(--suave)}
p em,.directo em{color:var(--marca-texto);font-weight:700}
.wrap{overflow-x:auto;background:#fff;border:2px solid var(--tinta);border-radius:24px;box-shadow:6px 6px 0 var(--tinta)}
table{border-collapse:collapse;width:100%;min-width:720px}
thead th{padding:16px 6px 18px;vertical-align:bottom;border-bottom:2px solid var(--tinta);text-align:center}
thead th:first-child{text-align:left;padding-left:20px;font-weight:400;font-size:14px;color:var(--suave)}
.t{display:block;font-weight:700;font-size:15px;line-height:1.15}.b{display:block;font-size:12px;color:var(--gris);margin-top:4px;line-height:1.35}
th.nos{background:var(--naranja);width:112px}th.nos em{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:15px;display:block;margin-top:6px;color:var(--tinta)}
tbody th{text-align:left;padding:16px 20px;font-weight:400}tbody .t{font-size:16px}tbody .b{font-size:13px}
tbody tr{border-bottom:1px solid #ECE8F2}td{text-align:center;padding:12px 4px}td.nos{background:#FF8A1F26}
th:first-child{position:sticky;left:0;background:#fff;min-width:200px}
.leyenda{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:center;font-size:14px;color:var(--suave)}.leyenda span{display:inline-flex;gap:8px;align-items:center}
.directo{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px 48px;background:#fff;border:2px solid var(--tinta);border-radius:24px;padding:40px;box-shadow:6px 6px 0 var(--amarillo)}
.directo h3{font-size:2rem;margin-bottom:14px}.directo p{margin:0 0 14px;font-size:1.0625rem;line-height:1.6;color:var(--suave)}
.directo .gancho{font-size:1.25rem;line-height:1.45;color:var(--tinta)}
.cta{align-self:center;display:inline-flex;align-items:center;min-height:52px;padding:0 28px;border-radius:999px;background:var(--naranja);color:var(--tinta);font-weight:700;font-size:17px;text-decoration:none;border:2px solid var(--tinta);box-shadow:4px 4px 0 var(--tinta)}
.pie{text-align:center;font-size:13px;color:var(--gris);max-width:760px;margin:0 auto}
</style></head><body><section id="app"></section>
<script>
const ICON={
 si:(s=26,c='#fff')=>`<svg role="img" aria-label="Sí" width="${s}" height="${s}" viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="#1A1530"/><path d="M8 13.5l3.5 3.5 6.5-7.5" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 no:(s=26)=>`<svg role="img" aria-label="No" width="${s}" height="${s}" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11.5" fill="none" stroke="#8A8599" stroke-width="2"/><path d="M9.5 9.5l7 7M16.5 9.5l-7 7" stroke="#8A8599" stroke-width="2.2" stroke-linecap="round"/></svg>`,
 parcial:(s=26)=>`<svg role="img" aria-label="Parcial" width="${s}" height="${s}" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11.5" fill="none" stroke="#1A1530" stroke-width="2"/><path d="M13 1.5a11.5 11.5 0 0 1 0 23z" fill="#1A1530"/></svg>`};
const md=t=>t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/_(.+?)_/g,'<em>$1</em>').replace(/\*(.+?)\*/g,'<em>$1</em>');
fetch('../contenido/comparativa.es.json').then(r=>r.json()).then(d=>{
 const cols=d.columnas, dir=d.directo, P=dir.parrafos;
 const head=cols.map(c=>`<th scope="col"><span class="t">${c.titulo}</span><span class="b">${c.bajada}</span></th>`).join('');
 const rows=d.filas.map(f=>`<tr><th scope="row"><span class="t">${f.titulo}</span><span class="b">${f.bajada}</span></th><td class="nos">${ICON.si(30,'#FFD23F')}</td>${cols.map(c=>`<td>${ICON[f.valores[c.id]]()}</td>`).join('')}</tr>`).join('');
 const col=(ix)=>ix.map((i,k)=>`<p${dir.columnas&&i===dir.columnas.derecha[0]?' class="gancho"':''}>${md(P[i])}</p>`).join('');
 document.getElementById('app').innerHTML=`
 <header><span class="kicker">${d.kicker}</span><h2>${md(d.titulo)}</h2><p>${md(d.bajada)}</p></header>
 <div class="wrap"><table><thead><tr><th scope="col">Lo ideal en un regalo</th><th scope="col" class="nos">${ICON.si(30,'#FFD23F')}<em>Regalale Bitcoin</em></th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
 <div class="leyenda"><span>${ICON.si(20)} ${d.valores.si}</span><span>${ICON.no(20)} ${d.valores.no}</span><span>${ICON.parcial(20)} ${d.valores.parcial}</span></div>
 <div class="directo"><div><h3>${dir.titulo}</h3>${col(dir.columnas.izquierda)}</div><div>${col(dir.columnas.derecha)}</div></div>
 <a class="cta" href="/regalar">${d.cta} →</a><p class="pie">${d.pie}</p>`;
});
</script></body></html>
