name: Deploy web mainnet

# Publica la web de mainnet en Firebase Hosting (sitio regalalebitcoins). Solo a mano y solo
# desde main: no hay deploy automático por push. La API no se toca (ver docs/deploy.md).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # para la federación de identidades con Google (sin claves guardadas)

concurrency:
  group: deploy-mainnet
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      herramienta: ${{ steps.version.outputs.herramienta }}
    steps:
      # Actions fijadas por commit, no por tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Compila y escribe version.json con la huella; queda en el resumen para docs/versiones.md.
      - run: pnpm build:mainnet
      - id: version
        run: |
          node -e "const v=require('./apps/web/dist-mainnet/version.json'); console.log('Commit: '+v.commit+'\nHuella: '+v.huella+'\nHerramienta: '+v.herramienta)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "herramienta=$(node -p "require('./apps/web/dist-mainnet/version.json').herramienta")" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/522829661671/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: deploy-hosting@regalalebitcoins.iam.gserviceaccount.com
      - run: npx --yes firebase-tools@15.33.0 deploy --only hosting:mainnet --project regalalebitcoins --non-interactive

  # Copia de la herramienta sin conexión en GitHub (Claudia, 08/11/2026): si el sitio desaparece,
  # quien no la bajó la encuentra en las versiones publicadas del repo. Se vuelve a compilar acá
  # (la compilación es reproducible) y solo se publica si da la misma huella que la del sitio. Es un
  # trabajo aparte para que el permiso de escribir en el repo no lo tenga el paso de Firebase.
  herramienta:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @regalale/web build:offline
      - name: Comprobar la huella y publicar
        env:
          GH_TOKEN: ${{ github.token }}
          ESPERADA: ${{ needs.deploy.outputs.herramienta }}
        run: |
          cp apps/web/dist-offline/offline.html regalalebitcoin-sin-conexion.html
          HUELLA=$(sha256sum regalalebitcoin-sin-conexion.html | cut -d' ' -f1)
          if [ "$HUELLA" != "$ESPERADA" ]; then
            echo "La herramienta compilada acá ($HUELLA) no coincide con la del sitio ($ESPERADA): no se publica." >&2
            exit 1
          fi
          sha256sum regalalebitcoin-sin-conexion.html > SHA256SUMS
          TAG="web-${GITHUB_SHA::12}"
          NOTAS="Herramienta sin conexión de regalalebitcoin.com, versión del commit ${GITHUB_SHA}.

          Huella (SHA-256): ${HUELLA}

          Bajala, comprobá la huella (sha256sum en Linux, shasum -a 256 en Mac, certutil -hashfile … SHA256 en Windows), desconectá internet y abrila con el navegador. Con el link y las 4 palabras de un regalo da las 12 palabras y la contraseña para abrirlo en cualquier billetera; con el código de recuperación, lista los regalos que hiciste."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" regalalebitcoin-sin-conexion.html SHA256SUMS --clobber
          else
            gh release create "$TAG" regalalebitcoin-sin-conexion.html SHA256SUMS --target "$GITHUB_SHA" --title "Herramienta sin conexión (${GITHUB_SHA::12})" --notes "$NOTAS" --latest
          fi
          echo "Publicada en ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
